name: DAB2

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  EB_APPLICATION_NAME: TPRM
  EB_ENVIRONMENT_NAME: The-Circle
  S3_BUCKET: the-circle-bucket-294983767467-eu-west-2-an

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Publish .NET application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet publish -c Release -o publish

      - name: Show OIDC claims
        shell: pwsh
        run: |
          $url = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com"

          $headers = @{
            Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          }

          $response = Invoke-RestMethod -Uri $url -Headers $headers

          $jwt = $response.value
          $payload = $jwt.Split('.')[1]

          $payload = $payload.Replace('-', '+').Replace('_', '/')
          while ($payload.Length % 4) {
            $payload += '='
          }

          $json = [System.Text.Encoding]::UTF8.GetString(
            [Convert]::FromBase64String($payload)
          )

          $claims = $json | ConvertFrom-Json

          Write-Host "ISS: $($claims.iss)"
          Write-Host "AUD: $($claims.aud)"
          Write-Host "SUB: $($claims.sub)"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::294983767467:role/Git_Full_Circle
          aws-region: ${{ env.AWS_REGION }}

      - name: Package application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Compress-Archive `
            -Path publish\* `
            -DestinationPath site.zip

          $manifest = @{
            manifestVersion = 1
            deployments = @{
              aspNetCoreWeb = @(
                @{
                  name = "Full_Circle"
                  parameters = @{
                    appBundle = "site.zip"
                    appPath = "/"
                    hostingModel = "inprocess"
                  }
                }
              )
            }
          }

          $manifest |
            ConvertTo-Json -Depth 10 |
            Set-Content `
              -Path aws-windows-deployment-manifest.json `
              -Encoding utf8

          Compress-Archive `
            -Path site.zip,aws-windows-deployment-manifest.json `
            -DestinationPath deploy.zip

      - name: Upload application bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "${{ github.sha }}"
          $s3Key = "elastic-beanstalk/$version.zip"

          aws s3 cp deploy.zip "s3://${env:S3_BUCKET}/$s3Key"

      - name: Create Elastic Beanstalk application version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "${{ github.sha }}"
          $s3Key = "elastic-beanstalk/$version.zip"

          aws elasticbeanstalk create-application-version `
            --application-name "${env:EB_APPLICATION_NAME}" `
            --version-label "$version" `
            --source-bundle "S3Bucket=${env:S3_BUCKET},S3Key=$s3Key"

      - name: Deploy application version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "${{ github.sha }}"

          aws elasticbeanstalk update-environment `
            --environment-name "${env:EB_ENVIRONMENT_NAME}" `
            --version-label "$version"

          aws elasticbeanstalk wait environment-updated `
            --environment-names "${env:EB_ENVIRONMENT_NAME}"